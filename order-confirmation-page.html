<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Avenue</title>
  <link rel="stylesheet" href="/src/scss/style.scss" />
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Lobster&display=swap&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <header class="header">
    <div class="overlay has-fade"></div>
    <nav class="container container--pall flex flex-jc-sb flex-ai-c hide-for-desktop">
      <a href="index.html" class="header__logo">
        <img src="/img/logo.svg" alt="Candy Avenue 🍭" />
      </a>

      <a href="/product-page.html?favorites=true" class="header__icon"><img src="/img/icon_Favorites.svg"
          alt="Favorites" /></a>

      <a href="#" class="header__icon"><img src="/img/icon_ShoppingCartSimple.svg" alt="Shopping Cart" /></a>

      <a id="btn-hamburger" href="#" class="header__toggle">
        <span></span>
        <span></span>
        <span></span>
      </a>

      <div class="header__menu has-fade">
        <a href="product-page.html">All</a>
        <a href="product-page.html?isNew=true">New</a>
        <a href="product-page.html?category=lollipops">Lollipops</a>
        <a href="product-page.html?category=chocolate">Chocolate</a>
        <a href="product-page.html?category=gummies">Gummies</a>
        <a href="product-page.html?category=licorice">Licorice</a>
      </div>
    </nav>
    <div class="header__desktop hide-for-mobile">
      <div class="header-box container">
        <a href="index.html" class="logo">
          <img src="/img/logo.svg" alt="Candy Avenue" />
        </a>

        <form id="search-form">
          <div class="search-wrapper">
            <input type="text" placeholder="Search for goodies..." />
            <button type="submit" class="search-btn">
              <img src="/img/icon_search.svg" alt="Search" />
            </button>
          </div>
        </form>

        <div id="icon-box">
          <a href="/product-page.html?favorites=true"><img src="/img/icon_Favorites.svg" alt="Favorites" /></a>

          <a href="#"><img src="/img/icon_ShoppingCartSimple.svg" alt="Shopping Cart" /></a>
        </div>
      </div>

      <div class="nav__desktop">
        <ul class="nav-list">
          <li><a href="product-page.html">All</a></li>
          <li><a href="product-page.html?isNew=true">New</a></li>
          <li>
            <a href="product-page.html?category=lollipops">Lollipops</a>
          </li>
          <li>
            <a href="product-page.html?category=chocolate">Chocolate</a>
          </li>
          <li><a href="product-page.html?category=gummies">Gummies</a></li>
          <li><a href="product-page.html?category=licorice">Licorice</a></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- ORDER CONFIRMATION MESSAGE -->

  <main class="container container--pall">
    <section class="order-status flex">
      <div class="order-status__icon">
        <svg viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
          <g stroke="currentColor" stroke-width="2" fill="none" fill-rule="evenodd" stroke-linecap="round"
            stroke-linejoin="round">
            <path class="circle"
              d="M13 1C6.372583 1 1 6.372583 1 13s5.372583 12 12 12 12-5.372583 12-12S19.627417 1 13 1z" />
            <path class="tick" d="M6.5 13.5L10 17 l8.808621-8.308621" />
          </g>
        </svg>
      </div>
      <div class="order-status__text">
        <h1>Sweet!</h1>
        <h2>Your order has been placed.</h2>
        <p>
          Your candy stash is officially reserved. <br />
          Time to sit back, relax, and imagine all the sweetness coming your
          way!
        </p>
      </div>
      <div class="order-status__cta flex flex-ai-c">
        <button class="cart-btn cart-btn--secondary" onclick="document.location = 'index.html'">
          Continue Shopping
        </button>
        <!-- <a href="">View order details</a> -->
      </div>
    </section>
  </main>

  <!-- //// END OF //// ORDER CONFIRMATION MESSAGE -->

  <!-- Import Footer -->
  <div id="footer"></div>

  <script type="module" src="/src/ts/main.ts"></script>
  <script type="module" src="/src/ts/layouts/Footer.ts"></script>
</body>

</html>
