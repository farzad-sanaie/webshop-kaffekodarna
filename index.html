<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Candy Avenue</title>
  <link rel="stylesheet" href="/src/scss/style.scss" />
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Lobster&display=swap&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  
  <!-- Include Header -->
  <div id="header"></div>

  <main class="flex flex-ai-c">

    <section class="hero container">
      <div class="hero__img">
        <div class="flex flex-ai-c hero__text container container--pall">
          <h1>
            Classic Candy, <br />
            Sweet as Ever
          </h1>
          <h2>
            Timeless treats inspired <br />
            by the 1950's
          </h2>
          <button onclick="document.location = 'product-page.html'" class="cart-btn cart-btn--secondary hero__btn">
            Shop all <img src="img/ArrowRight.svg" alt="Arrow right" />
          </button>
        </div>
      </div>
    </section>

    <section class="container">
      <h2>Popular categories</h2>
      <div id="category-btns" class="flex">
        <button class="category-btns">Chocolate</button>
        <button class="category-btns">Gummies</button>
        <button class="category-btns">Licorice</button>
      </div>
    </section>
    <section class="new-arrivals">
      <h2>New arrivals</h2>

      <div class="flex products">
        <article class="product-card">
          <span class="badge">NEW</span>
          <img src="/img/products/filled_licorice_sticks.png" alt="Filled licorice sticks" />

          <div class="product-info">
            <h3>Filled licorice sticks</h3>
            <p>Lorem ipsum</p>
            <button class="see-more-btn">See more</button>
          </div>
        </article>

        <article class="product-card">
          <span class="badge">NEW</span>
          <img src="/img/products/choco_bar_caramel.png" alt="Choco bar caramel" />

          <div class="product-info">
            <h3>Choco bar caramel</h3>
            <p>Lorem ipsum</p>
            <button class="see-more-btn">See more</button>
          </div>
        </article>

        <article class="product-card">
          <span class="badge">NEW</span>
          <img src="/img/products/choco_bar_nougat.png" alt="Choco bar nougat" />

          <div class="product-info">
            <h3>Choco bar nougat</h3>
            <p>Lorem ipsum</p>
            <button class="see-more-btn">See more</button>
          </div>
        </article>
      </div>

      <button onclick="document.location = 'product-page.html'" class="cart-btn cart-btn--secondary hero__btn">
        Shop all <img src="img/ArrowRight.svg" alt="Arrow right" />
      </button>
    </section>
  </main>

  <!-- Include Footer -->
  <div id="footer"></div>

  <!-- Include Scipt Links -->
  <!-- Include Header Scipt Link -->
  <script type="module" src="/src/ts/main.ts"></script>
  <script type="module" src="/src/ts/layouts/Footer.ts"></script>
</body>

</html>
