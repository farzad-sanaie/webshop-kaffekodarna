<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candy Avenue</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header_box container">
        <a href="#" class="logo">
          <img src="/img/logo.svg" alt="Candy Avenue" />
        </a>

        <form id="search_form">
          <div class="search_wrapper">
            <input type="text" placeholder="Search for goodies..." />
            <button type="submit" class="search_btn">
              <img src="/img/search.png" alt="Search" />
            </button>
          </div>
        </form>

        <div id="icon_box">
          <button class="icon_btn">
            <img src="/img/heart.png" alt="Favorites" />
          </button>
          <button class="icon_btn">
            <img src="/img/cart.png" alt="Cart" />
          </button>
        </div>
      </div>

      <nav>
        <ul class="nav_list">
          <li><a href="#">New</a></li>
          <li><a href="#">Popular</a></li>
          <li><a href="#">Limited</a></li>
          <li><a href="#">Chocolate</a></li>
          <li><a href="#">Gummies</a></li>
          <li><a href="#">Licorice</a></li>
          <li><a href="#">More</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Classic Candy,<br />Sweet as Ever</h1>
      <p>Timeless treats inspired by the 1950's</p>

      <section>
        <h2>Popular categories</h2>
        <div id="category_btns">
          <button>Classics</button>
          <button>Chocolate</button>
          <button>Gummies</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer_inner container">
        <a href="#" class="logo">
          <img src="/img/logo.svg" alt="Candy Avenue" />
        </a>

        <div class="footer_box">
          <ul>
            <li>About us</li>
            <li>Brands</li>
          </ul>

          <ul>
            <li>FAQ</li>
            <li>Contact us</li>
          </ul>

          <ul>
            <li>Terms & Conditions</li>
            <li>Cookies</li>
            <li>Privacy policy</li>
          </ul>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
