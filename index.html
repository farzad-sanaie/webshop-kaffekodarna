<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candy Avenue</title>
    <link rel="stylesheet" href="style.css" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="header_box container">
        <a href="#" class="logo">
          <img src="/img/logo.svg" alt="Candy Avenue" />
        </a>

        <form id="searchForm">
          <input type="text" placeholder="Search for goodies..." />
        </form>

        <div id="icon_box">
          <span>♡</span>
          <span>🛒</span>
        </div>
      </div>

      <nav>
        <ul class="nav_list">
          <li><a href="#">New</a></li>
          <li><a href="#">Popular</a></li>
          <li><a href="#">Limited</a></li>
          <li><a href="#">Chocolate</a></li>
          <li><a href="#">Gummies</a></li>
          <li><a href="#">Licorice</a></li>
          <li><a href="#">More</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Classic Candy,<br />Sweet as Ever</h1>
      <p>Timeless treats inspired by the 1950's</p>

      <section>
        <h2>Popular categories</h2>
        <div id="category_btns">
          <button>Classics</button>
          <button>Chocolate</button>
          <button>Gummies</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer_inner container">
        <a href="#" class="logo">
          <img src="/img/logo.svg" alt="Candy Avenue" />
        </a>

        <div class="footer_box">
          <ul>
            <li>About us</li>
            <li>Brands</li>
          </ul>

          <ul>
            <li>FAQ</li>
            <li>Contact us</li>
          </ul>

          <ul>
            <li>Terms & Conditions</li>
            <li>Cookies</li>
            <li>Privacy policy</li>
          </ul>
        </div>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
